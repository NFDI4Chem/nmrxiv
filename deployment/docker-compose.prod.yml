services:
  app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
    image: nmrxiv/app:latest
    env_file:
      - ../.env
    environment:
      - SUPERVISOR_PHP_COMMAND="/usr/local/bin/php -d variables_order=EGPCS /var/www/html/artisan octane:start --server=frankenphp --host=0.0.0.0 --admin-port=2019 --port=80"
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - app_storage:/var/www/html/storage
      - caddy_data:/data/caddy
      - ../.env:/var/www/html/.env
    networks:
      - nmrxiv_net
    depends_on:
      - pgsql
      - redis
      - meilisearch
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/octane-test"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.worker
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
        - NO_PROXY=${NO_PROXY}
    image: nmrxiv/worker:latest
    env_file:
      - ../.env
    environment:
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}
    volumes:
      - app_storage:/var/www/html/storage
      - ../.env:/var/www/html/.env
    networks:
      - nmrxiv_net
    depends_on:
      - app
      - pgsql
      - redis
    restart: unless-stopped

  pgsql:
    image: "informaticsmatters/rdkit-cartridge-debian:latest"
    env_file:
      - ../.env
    environment:
      - PG_VERSION=${DB_VERSION:-15.4}
      - POSTGRES_DB=${DB_DATABASE:-nmrxiv}
      - POSTGRES_USER=${DB_USERNAME:-nmrxiv}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgsql_data:/var/lib/postgresql/data
    networks:
      - nmrxiv_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE:-nmrxiv}", "-U", "${DB_USERNAME:-nmrxiv}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    image: 'redis:alpine'
    volumes:
      - redis_data:/data
    networks:
      - nmrxiv_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  meilisearch:
    image: 'getmeili/meilisearch:latest'
    env_file:
      - ../.env
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_KEY:-ThisIsALongSecureKeyWith32Chars}
      - MEILI_NO_ANALYTICS=true
      - MEILI_ENV=production
    networks:
      - nmrxiv_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  nmrxiv_net:
    driver: bridge

volumes:
  app_storage:
    driver: local
  pgsql_data:
    driver: local
  redis_data:
    driver: local
  meilisearch_data:
    driver: local
  caddy_data:
    driver: local 