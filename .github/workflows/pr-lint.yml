name: PR Lint & Security

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - development
      - main

permissions:
  contents: read
  security-events: write

jobs:
  lint-security:
    name: Lint & Security (PR)
    uses: ./.github/workflows/lint-security-check.yml
    with:
      run_php: true
      run_js: true
      run_secrets: true
