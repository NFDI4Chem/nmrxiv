name: Build and Push Spectra Parser Images

on:
  push:
    branches: [spectra-parser]

permissions:
  contents: read

env:
  REPOSITORY_NAME: nmrxiv
  REPOSITORY_NAMESPACE: nfdi4chem
  IMAGE_TAG: spectra-parser

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - name: app
            file: ./deployment/Dockerfile
          - name: worker
            file: ./deployment/Dockerfile.worker

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push ${{ matrix.image.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.file }}
          push: true
          build-args: |
            RELEASE_VERSION=${{ env.IMAGE_TAG }}
          tags: |
            ${{ env.REPOSITORY_NAMESPACE }}/${{ env.REPOSITORY_NAME }}:${{ matrix.image.name }}-${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ env.IMAGE_TAG }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ env.IMAGE_TAG }}
