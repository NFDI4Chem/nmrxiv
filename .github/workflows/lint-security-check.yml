name: Lint and Security Checks

on:
  workflow_call:
    inputs:
      run_php:
        description: "Run PHP lint & security job"
        required: false
        type: boolean
        default: true
      run_js:
        description: "Run JS lint & security job"
        required: false
        type: boolean
        default: true
      run_secrets:
        description: "Run secret leakage detection job"
        required: false
        type: boolean
        default: true
    secrets:
      DOCKER_HUB_USERNAME:
        required: false
      DOCKER_HUB_PASSWORD:
        required: false

permissions:
  contents: read
  security-events: write

concurrency:
  group: lint-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    if: ${{ inputs.run_php }}
    name: PHP Lint & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
          extensions: mbstring, intl, pdo, pdo_mysql, pdo_pgsql
          ini-values: memory_limit=512M

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            ~/.cache/composer/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - name: Validate composer.json
        run: composer validate --no-check-publish --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP code style (Pint)
        run: vendor/bin/pint --test

      - name: Composer security audit
        run: composer audit --no-interaction --locked

  js:
    if: ${{ inputs.run_js }}
    name: JS Lint & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: ESLint
        id: eslint
        run: |
          set +e
          npx eslint --ext .js,.vue --ignore-path .gitignore -f sarif -o eslint-results.sarif resources/js
          code=$?
          echo "$code" > eslint-exit-code.txt
          # Never fail here; we fail after SARIF upload so annotations appear
          exit 0

      - name: Upload ESLint SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-results.sarif

      - name: Fail if ESLint errors
        run: |
          code=$(cat eslint-exit-code.txt || echo 0)
          if [ "$code" -ne 0 ]; then
            echo "ESLint reported errors (exit code $code). Failing job after SARIF upload." >&2
            exit 1
          fi

      - name: Prettier (check)
        run: npx prettier resources/js --check

      - name: npm audit (high+)
        run: npm audit --audit-level=high

  secrets:
    if: ${{ inputs.run_secrets }}
    name: Secret Leakage Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --no-git --redact --report-format sarif --report-path gitleaks.sarif

      - name: Upload SARIF (code scanning)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif