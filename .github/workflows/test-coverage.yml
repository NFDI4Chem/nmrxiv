name: Tests & Code Coverage

on:
  push:
    branches: test-report-code-cov

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        php-version: [8.3]
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: nmrxiv_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=3
      
      redis:
        image: redis:7.0
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3
      
      meilisearch:
        image: getmeili/meilisearch:v1.5
        ports:
          - 7700:7700
        env:
          MEILI_ENV: development
          MEILI_NO_ANALYTICS: true
        options: --health-cmd="curl -f http://localhost:7700/health || exit 1" --health-interval=10s --health-timeout=5s --health-retries=3

    name: PHP ${{ matrix.php-version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, redis, pgsql, pdo_pgsql
        coverage: xdebug
        
    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-version }}-
          
    - name: Install dependencies
      run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader
      
    - name: Cache Node modules
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
          
    - name: Install Node dependencies
      run: npm ci
      
    - name: Build frontend assets
      run: npm run build
      
    - name: Copy environment file
      run: cp .env.ci .env
      
    - name: Generate application key
      run: php artisan key:generate
      
    - name: Directory permissions
      run: chmod -R 777 storage bootstrap/cache
      
    - name: Wait for services to be ready
      run: |
        # Wait for PostgreSQL
        until pg_isready -h 127.0.0.1 -p 5432 -U postgres; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done
        
        # Wait for Redis
        until redis-cli -h 127.0.0.1 -p 6379 ping; do
          echo "Waiting for Redis..."
          sleep 2
        done
        
        # Wait for Meilisearch
        until curl -f http://127.0.0.1:7700/health > /dev/null 2>&1; do
          echo "Waiting for Meilisearch..."
          sleep 2
        done
        
        echo "All services are ready!"
      
    - name: Run database migrations
      run: php artisan migrate --force
        
    - name: Run database seeders
      run: php artisan db:seed --force
        
    - name: Run tests with coverage
      run: php artisan test --coverage --coverage-clover=coverage.xml --coverage-html=coverage-report --coverage-text --colors=never
      env:
        # Override only the critical settings that might differ from .env.ci
        APP_ENV: testing
        SCOUT_DRIVER: null
        
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
        
    - name: Upload coverage to artifacts
      uses: actions/upload-artifact@v4
      if: matrix.php-version == '8.3'
      with:
        name: coverage-report
        path: coverage-report/
        retention-days: 30